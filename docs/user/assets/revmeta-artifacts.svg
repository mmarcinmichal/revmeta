<path class="arb" d="M1134 249 H1188"/>
<text class="s blu" x="1161" y="240" font-size="15" text-anchor="middle">to</text>

<!-- B -> A -->
<path class="arb" d="M820 306 V410"/>
<text class="s blu" x="830" y="351" font-size="16">subject of each mapping = a RevMeta term</text>

<!-- A -->
<rect class="grp" x="590" y="370" width="560" height="196" rx="12"/>
<text class="s blu" x="606" y="398" font-size="21" font-weight="bold">A · Vocabulary</text>
<rect class="out" x="606" y="412" width="300" height="140" rx="8"/>
<text class="m" x="620" y="440" font-size="19" font-weight="bold">vocabulary.ttl / .jsonld</text>
<text class="s" x="620" y="468" font-size="18">1 scheme · 14 facet collections</text>
<text class="s" x="620" y="492" font-size="18">102 concepts with definitions</text>
<rect class="out" x="620" y="506" width="272" height="32" rx="6" style="fill:#ffffff"/>
<text class="s" x="632" y="528" font-size="16">691 typed Codebook items</text>
<rect class="out" x="926" y="412" width="208" height="140" rx="8"/>
<text class="m" x="940" y="440" font-size="16" font-weight="bold">decision-states.ttl</text>
<text class="s" x="940" y="468" font-size="18">7 decision states</text>
<text class="s" x="940" y="492" font-size="18">with definitions</text>
<text class="s mut" x="940" y="520" font-size="15">(SATISFIED, AMBIGUOUS,</text>
<text class="s mut" x="940" y="540" font-size="15">VOCABULARY_GAP, …)</text>

<!-- C -->
<rect class="grp dash" x="20" y="616" width="1130" height="140" rx="12"/>
<text class="s blu" x="36" y="646" font-size="21" font-weight="bold">C · Publication coding profiles (created by annotators or tools)</text>
<text class="s" x="36" y="678" font-size="19">A complete profile would contain 102 decisions, one per term:</text>
<text class="s" x="36" y="704" font-size="19">term + decision state + source evidence + provenance</text>
<text class="s mut" x="36" y="734" font-size="17">Profiles are outside this build; profile RDF export is not implemented.</text>

<path class="arb" d="M165 616 V466"/>
<text class="s blu" x="176" y="535" font-size="16">uses coding rules</text>
<path class="arb" d="M760 616 V554"/>
<text class="s blu" x="770" y="594" font-size="16">uses controlled terms</text>
<path class="arb" d="M1030 616 V554"/>
<text class="s blu" x="1040" y="594" font-size="16">uses decision states</text>

