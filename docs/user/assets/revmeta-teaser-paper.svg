<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 520" width="1220" height="520" role="img" aria-labelledby="title description">
<title id="title">RevMeta term coding requires evidence beyond article labels</title><desc id="description">Two hypothetical review titles are contrasted with candidate coding interpretations. Question marks indicate unresolved attributes rather than verified positive assessments. The diagram does not present independently adjudicated source records.</desc>
<defs><style>
 .t{font-family:'TeX Gyre Termes','Times New Roman',serif;fill:#0b0b0b}
 .s{font-family:'TeX Gyre Heros','Liberation Sans',Arial,sans-serif;fill:#0b0b0b}
 .mut{fill:#52514e}
 .ln{stroke:#52514e;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .card{fill:#ffffff;stroke:#a3a29c;stroke-width:2}
 .cardb{fill:#ffffff;stroke:#2a78d6;stroke-width:2.5}
 .chip{fill:#cde2fb;stroke:#2a78d6;stroke-width:1.5}
 .chipg{fill:#f0efec;stroke:#a3a29c;stroke-width:1.5}
 .skin{fill:#f3d9c4;stroke:#52514e;stroke-width:2.5}
</style>
<g id="doc"><path d="M0 0 H40 L56 16 V72 H0 Z" fill="#ffffff" stroke="#52514e" stroke-width="2.5"/><path d="M40 0 V16 H56" class="ln"/>
 <rect x="9" y="28" width="38" height="5" rx="2.5" fill="#dcdbd6"/><rect x="9" y="40" width="30" height="5" rx="2.5" fill="#dcdbd6"/><rect x="9" y="52" width="36" height="5" rx="2.5" fill="#dcdbd6"/></g>
</defs>
<rect width="1220" height="520" fill="#fcfcfb"/>

<!-- LEFT: label view -->
<g transform="translate(40,34)"><circle r="22" class="skin"/><path class="ln" d="M-8 11 Q-4 8 0 11 T8 10"/><path class="ln" d="M-11 -8 L-3 -8 M3 -10 Q8 -15 12 -11"/><circle cx="-7" cy="0" r="2.6" fill="#0b0b0b"/><circle cx="7" cy="0" r="2.6" fill="#0b0b0b"/></g>
<text class="t" x="76" y="44" font-size="32" font-weight="bold">Label view</text>
<rect x="20" y="74" width="520" height="50" rx="25" fill="#f0efec" stroke="#a3a29c" stroke-width="2"/>
<circle cx="50" cy="98" r="10" class="ln"/><line x1="57" y1="105" x2="65" y2="113" class="ln"/>
<text class="t" x="76" y="108" font-size="27">umbrella reviews of earlier reviews</text>

<rect x="20" y="146" width="520" height="150" rx="10" class="card"/>
<use href="#doc" transform="translate(40,166)"/>
<text class="t" x="116" y="184" font-size="27" font-weight="bold">Example A</text>
<text class="t" x="116" y="220" font-size="27" font-style="italic">“umbrella review and meta-analysis</text>
<text class="t" x="116" y="252" font-size="27" font-style="italic">of systematic reviews”</text>
<text class="s" x="116" y="284" font-size="24" style="fill:#d03b3b">design? object? synthesis?</text>

<rect x="20" y="314" width="520" height="150" rx="10" class="card"/>
<use href="#doc" transform="translate(40,334)"/>
<text class="t" x="116" y="352" font-size="27" font-weight="bold">Example B</text>
<text class="t" x="116" y="388" font-size="27" font-style="italic">“scoping review of reviews</text>
<text class="t" x="116" y="420" font-size="27" font-style="italic">(meta-review)”</text>
<text class="s" x="116" y="452" font-size="24" style="fill:#d03b3b">umbrella? scoping? both?</text>

<!-- MIDDLE: thin RSP layer -->
<rect x="566" y="74" width="34" height="390" rx="17" fill="#104281"/>
<text class="s" x="583" y="269" font-size="24" font-weight="bold" style="fill:#ffffff" text-anchor="middle" transform="rotate(-90 583 269)">RevMeta · 14 facets · 102 terms</text>
<path class="ln" d="M603 269 H624 M614 259 L624 269 L614 279"/>

<!-- RIGHT: profile view -->
<g transform="translate(656,34)"><circle r="22" class="skin"/><path class="ln" d="M-9 8 Q0 16 9 8"/><circle cx="-7" cy="-2" r="2.6" fill="#0b0b0b"/><circle cx="7" cy="-2" r="2.6" fill="#0b0b0b"/></g>
<text class="t" x="692" y="44" font-size="32" font-weight="bold">Coding view</text>
<g class="s" font-size="24">
 <rect x="636" y="74" width="270" height="50" rx="25" class="chip"/><text x="771" y="107" text-anchor="middle">umbrella review design</text>
 <text class="t" x="921" y="108" font-size="30" font-weight="bold" text-anchor="middle">∧</text>
 <rect x="936" y="74" width="264" height="50" rx="25" class="chip"/><text x="1068" y="107" text-anchor="middle">object: existing review</text>
</g>

<rect x="636" y="146" width="564" height="150" rx="10" class="cardb"/>
<text class="t" x="656" y="184" font-size="27" font-weight="bold">Example A</text>
<g class="s" font-size="21">
 <rect x="656" y="200" width="267" height="36" rx="18" class="chip"/><text x="789.5" y="225" text-anchor="middle">? umbrella review design</text>
 <rect x="931" y="200" width="256" height="36" rx="18" class="chip"/><text x="1059" y="225" text-anchor="middle">? object: existing review</text>
 <rect x="656" y="244" width="182" height="36" rx="18" class="chip"/><text x="747" y="269" text-anchor="middle">? meta-analysis</text>
 <rect x="846" y="244" width="146" height="36" rx="18" class="chip"/><text x="919" y="269" text-anchor="middle">? registration</text>
 <text class="t mut" x="1006" y="270" font-size="23">quote + locator</text>
</g>

<rect x="636" y="314" width="564" height="150" rx="10" class="cardb"/>
<text class="t" x="656" y="352" font-size="27" font-weight="bold">Example B</text>
<g class="s" font-size="21">
 <rect x="656" y="368" width="267" height="36" rx="18" class="chip"/><text x="789.5" y="393" text-anchor="middle">? umbrella review design</text>
 <rect x="931" y="368" width="256" height="36" rx="18" class="chip"/><text x="1059" y="393" text-anchor="middle">? object: existing review</text>
 <rect x="656" y="412" width="258" height="36" rx="18" class="chip"/><text x="785" y="437" text-anchor="middle">? scoping review design</text>
 <rect x="922" y="412" width="150" height="36" rx="18" class="chipg"/><text x="997" y="437" text-anchor="middle">? registration</text>
</g>
<text class="s mut" x="610" y="496" font-size="17" text-anchor="middle">Hypothetical coding examples — no source check or measured retrieval result is claimed.</text>
</svg>